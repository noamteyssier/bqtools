[package]
name = "bqtools"
version = "0.6.1"
edition = "2021"
license = "MIT"
authors = ["Noam Teyssier"]
description = "A command-line tool for interacting with BINSEQ file formats."
repository = "https://github.com/noamteyssier/bqtools"
categories = ["command-line-utilities", "science::bioinformatics", "encoding"]
keywords = ["bioinformatics", "binseq", "fastx", "file-format", "sequencing"]

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
binseq = "0.10.0"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
env_logger = "0.11.11"
fixedbitset = "0.5.7"
gzp = "2.0.4"
hashbrown = "0.17.1"
libc = "0.2.189"
log = "0.4.34"
paraseq = "0.6.1"
rand = "0.10.3"
regex = "1.13.1"
sassy = { version = "0.2.6", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thousands = "0.2.0"
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zstd = { version = "0.14.0", features = ["zstdmt"] }

[dev-dependencies]
bon = "3.10.1"
itertools = "0.15.0"
niffler = "3.0.1"
tempfile = "3.27.0"

[features]
default = ["htslib"]
fuzzy = ["sassy"]
htslib = ["paraseq/htslib"]
gcs = ["paraseq/gcs"]
bqdoc = []

[[bin]]
name = "bqdoc"
path = "src/bin/bqdoc.rs"
required-features = ["bqdoc"]

[profile.release]
# debug = true
lto = true
codegen-units = 1

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
