site_name: bqtools
site_description: A command-line tool for interacting with BINSEQ file formats.
site_url: https://noamteyssier.github.io/bqtools/
repo_url: https://github.com/noamteyssier/bqtools
repo_name: noamteyssier/bqtools
theme:
  name: material
  variant: modern
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.instant
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: gruvbox-light
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: gruvbox-dark
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: false
  - pymdownx.highlight
  - pymdownx.superfences
extra_css:
  - stylesheets/extra.css
# Command pages under docs/commands/ are generated by `bqdoc`.
nav:
  - Introduction: index.md
  - Installation: installation.md
  - Formats: formats.md
  - Commands:
      - encode: commands/encode.md
      - decode: commands/decode.md
      - cat: commands/cat.md
      - info: commands/info.md
      - grep: commands/grep.md
      - sample: commands/sample.md
      - split: commands/split.md
      - pipe: commands/pipe.md
      - qc: commands/qc.md
      - revcomp: commands/revcomp.md
      - verify: commands/verify.md
